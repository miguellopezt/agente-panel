<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Panel decisor · agente de trading</title>
<link rel="preload" href="vendor/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="panel.css">
</head>
<body data-tab="hoy">
<a class="boton saltar" href="#principal">Saltar al contenido</a>
<div class="contenedor" id="principal">
  <header class="cabecera" id="cabecera" aria-live="polite"></header>
  <div id="error" hidden></div>

  <main class="rejilla">
    <section class="tarjeta col-12" data-tab="hoy" aria-labelledby="t-espera">
      <div class="titulo"><h2 id="t-espera" style="font-size:inherit">Te espera</h2>
        <button type="button" class="boton" id="actualizar" data-estado-boton="reposo">Actualizar</button></div>
      <div id="espera"></div>
    </section>

    <section class="col-12" data-tab="hoy" aria-label="Valor de las carteras">
      <div id="carteras"></div>
    </section>

    <section class="col-12" data-tab="hoy" aria-label="Señales por activo">
      <div id="activos"></div>
    </section>

    <section class="tarjeta col-12" data-tab="grafico" aria-labelledby="t-grafico">
      <div class="titulo"><h2 id="t-grafico" style="font-size:inherit">Gráfico</h2></div>
      <div class="controles">
        <div class="seg" id="vistas" role="group" aria-label="Qué mostrar"></div>
        <div class="seg" id="periodos" role="group" aria-label="Periodo"></div>
      </div>
      <div class="capas" id="capas" role="group" aria-label="Capas del gráfico" style="margin-bottom:12px"></div>
      <div id="aviso-grafico" hidden></div>
      <div class="grafico-marco">
        <div id="grafico" class="entrando" role="img" aria-label="Gráfico de carteras y precios"></div>
        <div id="tooltip" class="tooltip" aria-hidden="true"></div>
      </div>
      <div class="leyenda" id="leyenda"></div>
    </section>

    <section class="tarjeta col-8" data-tab="ordenes" aria-labelledby="t-ordenes">
      <div class="titulo"><h2 id="t-ordenes" style="font-size:inherit">Órdenes</h2></div>
      <div id="ordenes"></div>
    </section>

    <section class="tarjeta col-4" data-tab="ordenes" aria-labelledby="t-riesgo">
      <div class="titulo"><h2 id="t-riesgo" style="font-size:inherit">Riesgo</h2></div>
      <div id="riesgo"></div>
    </section>

    <section class="tarjeta col-4" data-tab="equipo" aria-labelledby="t-agentes">
      <div class="titulo"><h2 id="t-agentes" style="font-size:inherit">Agentes</h2></div>
      <div id="agentes"></div>
    </section>

    <section class="tarjeta col-4" data-tab="equipo" aria-labelledby="t-ramas">
      <div class="titulo"><h2 id="t-ramas" style="font-size:inherit">Ramas</h2></div>
      <div id="ramas"></div>
    </section>

    <section class="tarjeta col-4" data-tab="equipo" aria-labelledby="t-hitos">
      <div class="titulo"><h2 id="t-hitos" style="font-size:inherit">Hitos hasta abril de 2027</h2></div>
      <div id="hitos"></div>
    </section>
  </main>

  <footer>
    <span id="actualizado-pie"></span> · Simulación y modo demo: no es asesoramiento financiero ·
    Gráficos con <a href="https://www.tradingview.com/" target="_blank" rel="noopener noreferrer">TradingView Lightweight Charts™</a>
    (Apache 2.0).
  </footer>
</div>

<div class="velo" id="velo"></div>
<aside class="lateral" id="lateral" role="dialog" aria-modal="true" aria-labelledby="lateral-titulo" aria-hidden="true"></aside>
<div id="anuncio" class="sr" role="status" aria-live="polite" style="position:absolute;left:-9999px"></div>

<nav class="navegacion" aria-label="Secciones">
  <span class="indicador" aria-hidden="true"></span>
  <button type="button" class="pestana" data-tab="hoy" aria-selected="true">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9L10 3.5 16.5 9v7a1 1 0 01-1 1h-11a1 1 0 01-1-1V9z"/></svg>Hoy</button>
  <button type="button" class="pestana" data-tab="grafico" aria-selected="false">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15l4.5-5 3 3L17 5"/></svg>Gráfico</button>
  <button type="button" class="pestana" data-tab="ordenes" aria-selected="false">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h8"/></svg>Órdenes</button>
  <button type="button" class="pestana" data-tab="equipo" aria-selected="false">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="7" r="2.5"/><circle cx="14" cy="8" r="2"/><path d="M3 16c.5-3 2.5-4.5 4.5-4.5S11.500 13 12 16M12.500 12c2-.5 4 .5 4.500 3.500"/></svg>Equipo</button>
</nav>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="panel.js"></script>
</body>
</html>
